services:
  code-db-ords-deploy:
    secrets:
      - stp_db_username
      - stp_db_password
      - stp_app_db_username
      - stp_app_db_password
      - stp_apx_username
      - stp_apx_password
secrets:
  stp_db_username:
    name: ${COMPOSE_PROJECT_NAME}_stp_db_username
    external: true
  stp_db_password:
    name: ${COMPOSE_PROJECT_NAME}_stp_db_password
    external: true
  stp_app_db_username:
    name: ${COMPOSE_PROJECT_NAME}_stp_app_db_username
    external: true
  stp_app_db_password:
    name: ${COMPOSE_PROJECT_NAME}_stp_app_db_password
    external: true    
  stp_apx_username:
    name: ${COMPOSE_PROJECT_NAME}_stp_apx_username
    external: true
  stp_apx_password:
    name: ${COMPOSE_PROJECT_NAME}_stp_apx_password
    external: true    